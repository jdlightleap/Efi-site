 main{padding:16px 14px 50px}

/* ===== v5 additions (mobile-first overrides) ===== */

ks' cyber commitment for this price control (C1) is measured against the NCSC Cyber Assessment Framework. Field kit bought now may still be in service when today's encryption can be broken, so reusing NESO's quantum-safe work in buying specifications fits that commitment.", "src": "UK Power Networks ED2 commitments report 2024/25 (C1)", "url": "https://media.umbraco.io/ukpn-cms/1nxirw1d/ukpn_ed2_commitments_report_24-25.pdf", "more": [], "new": true}, "fmt": "90-minute lesson swap", "agenda": [["0:00", "20 min", "What has been done in GB and abroad, and what it found"], ["0:20", "25 min", "Questions about the leading project's lessons"], ["0:45", "25 min", "Copy, adapt or skip for your network"], ["1:10", "20 min", "Decide: owner and first step"]]}, {"id": "S11", "ref": "v4 §6 Story 11; v2 Story 11", "event": false, "cats": ["flex"], "tier": "Spread", "bridge": "B4", "title": "Data-centre flexibility at distribution level", "short": "Data-centre flexibility", "position": "Spreading in GB, but only at transmission and NESO level.", "why": "A familiar topic. The gap is narrower: none of the 242 projects on the networks' shared innovation portal that mention “data centre” is a local network's flexibility project.", "whynow": "EPRI/National Grid UK demo, Dec 2025", "whynow_short": "Dec 2025", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "An AI cluster in a UK demo met all of more than 200 power targets, with load cuts of up to 40%.", "bridge_txt": "Used with National Grid in the UK.", "innovation": "A distribution-level version, for data centres connected below transmission.", "objection": "We're bored of data centres.", "answer": "Fair. Only the distribution-level gap is new.", "gap": "Whether enough data centres connect at distribution level isn't checked.", "gb": "All projects found are NGET, NESO or SSEN-T.", "abroad": "EPRI DCFlex.", "matters": ["DSO flexibility", "Connections"], "ws": {"fmt": "swap", "who": ["DSO flexibility lead", ", "Decide: owner and first step"]]}, {"id": "S9", "ref": "v4 §6 Story 9; v2 Story 9", "event": false, "cats": ["storms"], "tier": "Spread", "bridge": "B2", "title": "Satellite texting on ordinary phones for storm comms", "short": "Satellite-to-phone", "position": "Spreading in GB.", "why": "Ordinary phones can now text via satellite. That could be a cheaper option alongside the dedicated satellite call points networks are building for storms.", "whynow": "O2 Satellite launched 26 Feb 2026", "whynow_short": "26 Feb 2026", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "Ordinary phones can text via satellite in GB (O2, Feb 2026).", "bridge_txt": "T-Mobile reported about 156,000 satellite texts during Hurricane Isaias (Oct 2026). No utility crew use found.", "innovation": "Feed satellite texting into live storm-comms projects as a lower-cost option.", "objection": "Texts aren't enough for crews.", "answer": "Possibly; it's a fallback, not a replacement.", "gap": "No utility crew use found.", "gb": "Keeping Comms Open (multi-DNO) uses dedicated satellite phones; ENWL Sure Comms.", "abroad": "T-Mobile (US).", "matters": ["Resilience planners", "Field operations"], "ws": {"fmt": "swap", "who": ["Resilience planner", "Field operations lead", "Telecoms"], "preread": ["EFI card (Satellite-to-phone)"], "key_q": "Copy, adapt or skip for crews and communities?", "experiment": "Add satellite texting to a storm exercise.", "measure": "Messages delivered when masts are down.", "measure_src": "EFI suggestion", "owner": "Resilience planner", "funding": "Within existing projects.", "missing": ["Crew use evidence"], "path": ["Lesson swap", "Storm exercise", "Feed into live projects"]}, "abroad_list": [{"flag": "🇺🇸", "country": "US", "what": "T-Mobile offers satellite-to-phone texting in disasters.", "result": "In use", "url": "https://www.t-mobile.com/news/network/how-t-mobile-keeps-people-connected-during-disasters"}], "history": [{"date": "2026-10-28T20:06", "type": "First published", "text": "In Edition 01 (28 Oct 2026).", "example": false}], "time": "0–2", "grade": null, "evidence": [], "signposts": [], "updated": "2026-10-28T20:06", "cost_lo": null, "cost_band": "none", "whynow_card": "O2 Satellite texting launched in GB on 26 Feb 2026", "ex": {"support": 18, "explore": 5, "up": 15, "down": 1, "status": "Backed"}, "ukl": {"line": "UK Power Networks' CommsConnect project upgrades substation routers to watch mobile network status, which it says is most useful during storms. Satellite-to-phone is a fallback worth comparing.", "src": "UK Power Networks NIA annual summary 2026 (CommsConnect)", "url": "https://smarter.energynetworks.org/media/13mb31kt/ukpn_nia-report-2026.pdf", "more": [], "new": false}, "fmt": "90-minute lesson swap", "agenda": [["0:00", "20 min", "What has been done in GB and abroad, and what it found"], ["0:20", "25 min", "Questions about the leading project's lessons"], ["0:45", "25 min", "Copy, adapt or skip for your network"], ["1:10", "20 min", "Decide: owner and first step"]]}, {"id": "S12", "ref": "v4 §6 Story 12; v2 Story 12", "event": false, "cats": ["storms"], "tier": "Spread", "bridge": "B3", "title": "AI weather models feeding fault-risk forecasts", "short": "AI weather to fault risk", "position": "Spreading in GB.", "why": "Several networks already link weather to fault risk. Newer AI weather models could sharpen it, and one paused project could be worth reviving.", "whynow": "DeepMind WeatherNext 3", "whynow_short": "WeatherNext 3", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "DeepMind WeatherNext 3.", "bridge_txt": "GB projects already link AI weather to fault risk.", "innovation": "Test the newer models in existing fault-risk tools.", "objection": "We already do this.", "answer": "Yes; the question is whether the newer models are better.", "gap": "No head-to-head comparison found.", "gb": "UK Power Networks WARN (SIF Discovery; no Alpha found), SPEN ory 13; v2 Story 13", "event": false, "cats": ["flex"], "tier": "Spread", "bridge": "B3", "title": "AI stand-ins for slow grid simulations", "short": "Neural operators", "position": "Spreading in GB (NESO).", "why": "Fast AI stand-ins for stability studies are already being tested by NESO, the system operator. Other networks can follow its results.", "whynow": "NESO Neural BB Phase 2 live since Apr 2026", "whynow_short": "Apr 2026", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "Neural operators: AI models that stand in for slow physics simulations.", "bridge_txt": "NESO Neural BB: over 98% accuracy on its own, and over 94% on a 400 kV network.", "innovation": "Follow and reuse NESO's Phase 2 results.", "objection": "It didn't scale to full GB.", "answer": "True: the full-GB test was only partly met because of compute cost. Phase 2 is live.", "gap": "Full-GB performance.", "gb": "NESO Neural BB Phase 1 and Phase 2.", "abroad": "Not re-checked in this research.", "matters": ["System studies teams"], "ws": {"fmt": "swap", "who": ["System studies lead", "Data scientist"], "preread": ["Neural BB summary"], "key_q": "What would we reuse once Phase 2 reports?", "experiment": "None; follow results.", "measure": "Reuse plan.", "measure_src": "EFI suggestion", "owner": "System studies lead", "funding": "Not needed.", "missing": ["Phase 2 results"], "path": ["Lesson swap", "Follow Phase 2", "Reuse"]}, "abroad_list": null, "history": [{"date": "2026-10-28T20:06", "type": "First published", "text": "In Edition 01 (28 Oct 2026).", "example": false}], "time": "2–5", "grade": null, "evidence": [], "signposts": [], "updated": "2026-10-28T20:06", "cost_lo": null, "cost_band": "none", "whynow_card": "NESO Neural BB Phase 2 live since Apr 2026", "ex": {"support": 10, "explore": 3, "up": 7, "down": 3, "status": "Backed"}, "ukl": {"line": "UK Power Networks' Python Power project (NIA, 2025–26, £358,000) made its network models run in open-source power-flow software, and found that getting real models to solve reliably took significant effort. AI stand-ins learn from many such runs, so that model base is where a test would start.", "src": "ENA Innovation Portal (Python Power)", "url": "https://smarter.energynetworks.org/projects/nia_ukpn0111/", "more": [], "new": true}, "fmt": "90-minute lesson swap", "agenda": [["0:00", "20 min", "What has been done in GB and abroad, and what it found"], ["0:20", "25 min", "Questions about the leading project's lessons"], ["0:45", "25 min", "Copy, adapt or skip for your network"], ["1:10", "20 min", "Decide: owner and first step"]]}, {"id": "S14", "ref": "v4 §6 Story 14; v2 Story 14", "event": false, "cats": ["assets"], "tier": "Spread", "bridge": "B2", "title": "Purpose-built robots for line and substation work", "short": "Field robots", "position": "Spreading in GB.", "why": "Several networks have robot projects starting now. The value is sharing what works; general-purpose humanoids aren't ready for live work.", "whynow": "New NGET robot projects, Aug–Oct 2026", "whynow_short": "Aug–Oct 2026", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "Purpose-built robots for lines and substations.", "bridge_txt": "Live GB projects.", "innovation": "Share lessons across networks.", "objection": "Humanoids will do it all soon.", "answer": "Not for live network work yet (EFI view).", "gap": "International precedent not re-checked.", "gb": "NGET TWIN-SPIDER, SpacerClear-CC, AEROINS; UK Power Networks Aero Prune; SSEN-T ODIN; SSEN RISE.", "abroad": "Not re-checked in this research.", "matters": ["Field operations", "Asset managers"], "ws": {"fmt": "swap", "who": ["Field operations lead", "Asset manager"], "preread": ["EFI card (Field robots)"], "key_q": "Which live project's lessons apply to us?", "experiment": "None; share lessons.", "measure": "Lessons adopted.", "measure_src": "EFI suggestion", "owner": "Field operations lead", "funding": "Not needed.", "missing": ["International comparison"], "path": ["Lesson swap", "Adopt", "—"]}, "abroad_list": null, "history": [{"date": "2026-10-28T20:06", "type": "First published", "text": "In Edition 01 (28 Oct 2026).", "example": false}], "time": "0–2", "grade": null, "evidence": [], "signposts": [], "updated": "2026-10-28T20:06", "cost_lo": null, "cost_band": "none", "whynow_card": "New NGET robot projects started Aug–Oct 2026", "ex": {"support": 20, "explore": 7, "up": 16, "down": 2, "status": "Backed"}, "ukl": {"line": "UK Power Networks is prototyping remote tree-cutting in Aero Prune (Dec 2025 – Jul 2027) and trialled a robot dog in cable tunnels in 2023.", "src": "ENA Innovation Portal (Aero Prune) and UK Power Networks news, 24 Aug 2023", "url": "https://smarter.energynetworks.org/projects/nia_ukpn0116/", "more": [], "new": false}, "fmt": "90-minute lesson swap", "agenda": [["0:00", "20 min", "What has been done in GB and abroad, and what it found"], ["0:20", "25 min", "Questions about the leading project's lessons"], ["0:45", "25 min", "Copy, adapt or skip for your network"], ["1:10", "20 min", "Decide: owner and first step"]]}, {"id": "S4", "ref": "v4 §6 Story 4; v2 Story 4", "event": false, "cats": ["assets"], "tier": "Spread", "bridge": "B1", "title": "Use simulation to cut physical type tests", "short": "Certify by simulation", "position": "Partly allowed inside today's standards. Weak link.", "why": "Standards already allow simulation to extend some type-test results for mainstream switchgear. Full replacement isn't on the table.", "whynow": "SF₆-free switchgear needs new type tests", "whynow_short": "Greener switchgear", "cost": null, "comps": "No cost comparable in the research", "breakthrough": "Other sectors accept simulation evidence (an analogy, e.g. the FDA).", "bridge_txt": "IEC TR 62271-307 gives guidance on extending type-test validity for switchgear from 1 to 52 kV.", "innovation": "Use the existing standard more, for SF₆-free kit.", "objection": "Simulation can't replace type tests.", "answer": "Agreed: CIGRE says it's “not envisaged”, and predictions varied by about 40%.", "gap": "Weak link to anything new.", "gb": "NGET NIA2_NGET0089 (SF₆-free type-test suitability, live).", "abroad": "Inside IEC and CIGRE work.", "matters": ["Plant and standards engineers"], "ws": {"fmt": "swap", "who": ["Plant engineer", "Standards lead"], "preread": ["EFI card (Certify by simulation)"], "key_q": "Are we using the existing standard fully?", "experiment": "None.", "measure": "—", "measure_src": "EFI suggestion", "owner": "Standards lead", "funding": "Not needed.", "missing": ["—"], "path": ["Lesson swap", "—", "—"]}, "abroad_list": [{"flag": "🌐", "country": "International", "what": "CIGRE benchmarked simulation tools for switchgear temperature-rise tests.", "result": "Research", "url": "https://electra.cigre.org/315-april-2021/technical-brochures/application-and-benchmark-of-multiphysics-simulation-tools-for-temperature-rise-calculations.html"}], "history": [{"date": "2026-10-28T20:06", "type": "First published", "text": "In Edition 01 (28 Oct 2026).", "example": false}, {"date": "2026-10-28T22:03", "type": "Correction", "text": "Standard reference corrected to IEC TR 62271-307.", "example": false}], "time": "2–5", "grade": null, "evidence": [], "signposts": [], "updated": "2026-10-28T22:03", "cost_lo": null, "cost_band": "none", "whynow_card": "SF₆-free switchgear needs new type tests as the gas is phased out", "ex": {"support": 9, "explore": 2, "up": 7, "down": 2, "status": "Backed"}, "ukl": {"line": "UK Power Networks counts SF₆ losses in its business carbon footprint, and its 2025 annual report lists switchgear affected by temperature rise among its climate risks. Simulation-backed temperature-rise tests could help qualify SF₆-free switchgear for hotter conditions.", "src": "UK Power Networks ED2 commitments report 2024/25 (business carbon footprint)", "url": "https://media.umbraco.io/ukpn-cms/1nxirw1d/ukpn_ed2_commitments_report_24-25.pdf", "more": [{"src": "UK Power Networks Holdings annual report 2025 (climate risks)", "url": "https://media.umbraco.io/ukpn-cms/apnncnzq/uk-power-networks-holdings-limited-2025.pdf"}], "new": true}, "fmt": "90-minute lesson swap", "agenda": [["0:00", "20 min", "What has been done in GB and abroad, and what it found"], ["0:20", "25 min", "Questions about the leading project's lessons"], ["0:45", "25 min", "Copy, adapt or skip for your network"], ["1:10", "20 min", "Decide: owner and first step"]]}, {"id": "H1", "ref": "Horizon research 29 Oct 2026; catalogue FR-RH-001, FR-GR-001", "event": false, "cats": ["assets"], "tier": "New", "bridge": "B2", "grade": "pilot", "hz": "5–10", "title": "Humanoid robots doing substation rounds and switching", "short": "Humanoid field robots", "position": "New to GB. State Grid reports humanoids in pilot use at Chinese substations. No success rates published.", "why": "China's biggest grid company reports humanoid robots in pilot use at several substations, including remote-controlled switching. If it works, robots could take on jobs that need hands, not just cameras. Nobody has published how well they do yet.", "whynow": "State Grid reports pilot use at several substations (Jul 2026) and a humanoid supporting a power-assurance job (Sep 2026); China consulting on a standard", "whynow_short": "Jul 2026", "cost": null, "comps": "Nearest GB spend: UK Power Networks' robot-dog tunnel trial (2023); NGET and SSEN field-robot projects (see Field robots).", "breakthrough": "Robot AI models can now run a whole humanoid body from one model. Google DeepMind's Gemini Robotics 2 (Jul 2026) is one, but its own figures show fine hand tasks often fail.", "bridge_txt": "State Grid Hangzhou is training humanoids for switching at the 110 kV Xiaohe substation, and State Grid says its humanoid is in pilot use at several substations. A partner firm names infrared temperature checks, switchgear operation and earthing as target tasks.", "innovation": "Decide now which field tasks a humanoid would have to do safely, and keep inspection data and safety rules robot-neutral, so GB can trial fast if the evidence arrives.", "objection": "This is hype. Tesla's own boss said its Optimus robots were not yet doing useful work.", "answer": "Agreed that it's early: no success rates are published. That's why the session sets signposts and triggers, not a budget.", "gap": "No success rates, supervision levels or failure data have been published from any substation trial.", "gb": "UK Power Networks trialled a robot dog in cable tunnels (2023). Several GB robotics projects use wheeled, legged or flying robots; none uses humanoids.", "abroad": "China: State Grid reports pilot use at several substations; a national standard is being drafted. No success rates published.", "matters": ["Field operations leads", "Health and safety leads", "Innovation leads", "Workforce planning"], "evidence": [{"date": "24 Sep 2026", "text": "A humanoid inspection robot supported power assurance at a 110 kV substation for a Hangzhou trade expo, with a team leader alongside. The report says it can do cabinet switching steps on its own. State Grid's own account, published by Xinhua Zhejiang; no success rate given.", "src": "Xinhua Zhejiang", "url": "http://www.zj.xinhuanet.com/20260924/1d405f6e26ee4a95b35e9121c229a053/c.html"}, {"date": "20 Jul 2026", "text": "State Grid says its Hangzhou substation humanoid is in pilot use at several substations, doing photo checks, teleoperated switching (a person steers the robot remotely) and temperature rounds. State Grid's own claim; no success rate given.", "src": "CPEM (from State Grid)", "url": "https://www.cpem.org.cn/list5/118732.html"}, {"date": "23 Jul 2026", "text": "State Grid Hangzhou is training humanoid robots for switching at a 110 kV substation.", "src": "Xinhua", "url": "https://www.news.cn/energy/20260723/85e60523f53049baad2db96057ff9108/c.html"}, {"date": "Jul 2026", "text": "UBTECH and a grid-equipment partner name infrared checks, switchgear operation and earthing as target tasks.", "src": "Yicai", "url": "https://www.yicai.com/news/103265696.html"}, {"date": "22 Jun 2026", "text": "China's industry ministry consulted on plans for a standard for humanoid robots, including in substations.", "src": "Xinhua", "url": "https://www.news.cn/tech/20260622/36b380f1ef27491c97f6e67f6b726a29/c.html"}, {"date": "30 Jul 2026", "text": "Gemini Robotics 2: one model controls a whole humanoid. Results are the company's own.", "src": "Google DeepMind", "url": "https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/"}, {"date": "Jul 2026", "text": "RoboDojo benchmark: the best public model completed 12.8% of attempted tasks.", "src": "arXiv preprint", "url": "https://arxiv.org/abs/2607.04434"}, {"date": "28 Jan 2026", "text": "Reality check: Elon Musk said Tesla's Optimus robots were not yet doing useful work in its factories.", "src": "Electrek", "url": "https://electrek.co/2026/01/28/musk-admits-no-optimus-robots-are-doing-useful-work-at-tesla-after-claiming-otherwise/"}], "signposts": ["A published success rate and supervision level from a live substation trial", "China's substation-humanoid standard text published", "An independent test of a humanoid on switching or gauge-reading tasks", "A European utility trial", "A GB safety-rules view on a robot acting under a switching instruction"], "ws": {"fmt": "ahead", "who": ["Field operations lead", "Health and safety lead", "Innovation lead", "A robotics researcher (university)"], "preread": ["This card", "UK Power Networks robot-dog trial summary (2023)", "Xinhua report on the Hangzhou trial"], "key_q": "Which field tasks would we let a humanoid do first, and what evidence would we need to see?", "scenario": "It is 2033. Humanoids do routine substation rounds in China under remote supervision. A GB supplier offers one for gauge reading and simple switching.", "signposts": ["Published success rates from substation trials", "Standard text from China", "Independent benchmark results above 50% on field-like tasks", "Robot price per unit"], "noregret": ["List the 10 field tasks that wheeled or legged robots can't do today", "Keep inspection data formats robot-neutral", "Ask the safety-rules owner how a robot could act under a switching instruction"], "partners": ["University robotics labs", "Robot makers with a UK presence", "Other GB networks running robot projects"], "triggers": ["A published substation trial with success rates → book a desk trial with a supplier", "A robot under £100k doing gauge reading reliably → scope an NIA project"], "owner": "Innovation lead, with field operations", "funding": "Watch only for now; NIA if a trigger fires.", "missing": ["Any published success or failure data from substation humanoid trials"], "path": ["Explore session: agree tasks, signposts and triggers", "Watch: quarterly check of signposts", "Project: NIA desk trial if a trigger fires"], "experiment": "List the 10 field tasks that wheeled or legged robots can't do today", "measure": "Signposts agreed, with a named watcher and a trigger date", "measure_src": "efi"}, "abroad_list": [{"flag": "🇨🇳", "country": "China", "what": "State Grid Hangzhou is training humanoids for switching at a live 110 kV substation.", "result": "Training trial", "url": "https://www.news.cn/energy/20260723/85e60523f53049baad2db96057ff9108/c.html"}, {"flag": "🇨🇳", "country": "China", "what": "State Grid says its Hangzhou substation humanoid is in pilot use at several substations, doing photo checks, teleoperated switching (a person steers the robot remotely) and temperature rounds (State Grid's own report).", "result": "Pilot use, operator's report", "url": "https://www.cpem.org.cn/list5/118732.html"}], "history": [{"date": "2026-10-29T09:30", "type": "New card", "text": "Added to the new Horizon tier, with evidence graded and links checked.", "example": false}, {"date": "2026-10-30T09:50", "type": "New evidence", "example": false, "text": "Added State Grid's reports of pilot use at several substations (CPEM, 20 Jul 2026) and a humanoid supporting a September 2026 power-assurance job (Xinhua Zhejiang, 24 Sep 2026); the report says it can do switching steps. Both are the operator's own claims."}, {"date": "2026-10-30T09:51", "type": "Moved from Horizon", "example": false, "text": "Moved from Horizon to New to GB (Oct 2026): State Grid reports humanoids in pilot use at Chinese substations, including remote-controlled switching. Not proven: no success rates have been published."}], "time": "5–10", "updated": "2026-10-30T09:51", "cost_lo": null, "cost_band": "none", "whynow_card": "State Grid reports humanoid pilots at several substations (Jul–Sep 2026)", "ex": {"support": 24, "explore": 7, "up": 18, "down": 5, "status": "Backed"}, "grade_note": "Pilot claims come from State Grid's own reports in state and trade media. No success rates, supervision levels or failure data have been published, so this is not proven.", "ukl": {"line": "UK Power Networks trialled Boston Dynamics' Spot robot dog in its cable tunnels (2023). Initial results showed the potential to cut confined-space inspection time by up to 50%, with savings estimated to rise to £324k a year by 2028. Humanoids are the next question: tasks that need hands.", "src": "UK Power Networks news, 24 Aug 2023", "url": "https://www.ukpowernetworks.co.uk/news/robot-dog", "more": [], "new": false}, "fmt": "90 minutes, get-ahead format", "agenda": [["0:00", "15 min", "Scenario: It is 2033. Humanoids do routine substation rounds in China under remote supervision. A GB supplier offers one for gauge reading and simple switching."], ["0:15", "15 min", "Evidence check: what is announced, demonstrated, piloted or generally available, and what is hype"], ["0:30", "20 min", "Signposts: what would tell us this is arriving, and who watches each one"], ["0:50", "20 min", "No-regret moves: what is worth doing now whatever happens"], ["1:10", "10 min", "Partners: who to get involved with, and how"], ["1:20", "10 min", "Triggers: agree the event that moves this to a project, and a review date"]]}, {"id": "H2", "ref": "Horizon research 29 Oct 2026", "event": false, "cats": ["flex", "connect"], "tier": "Horizon", "bridge": "B1", "grade": "demo", "hz": "10–15", "title": "Data centres in orbit, powered by constant sunlight", "short": "Space data centres", "position": "Horizon. Single satellites are running AI chips in orbit. Cost parity is a mid-2030s hope.", "why": "AI firms are testing data centres in orbit, where solar power is almost constant. Even the optimists put cost parity in the mid-2030s. For networks, it's a long-range question about how much data-centre demand stays on the ground.", "whynow": "Google's prototype launched 1 Oct 2026; Starcloud raised $250m (Aug 2026)", "whynow_short": "Oct 2026", "cost": null, "comps": "No GB network spend. Related: data-centre flexibility (Spreading card).", "breakthrough": "Starcloud-1 has run an Nvidia data-centre chip in orbit since Nov 2025 and trained a small AI model there.", "bridge_txt": "Google's analysis says launching solar-powered compute could match US data-centre power costs if launch prices fall to about $200 per kg, which it thinks could happen by the mid-2030s.", "innovation": "Get ahead: add an orbital-compute scenario to long-term demand forecasts, so data-centre connection plans aren't sized only for a ground-only future.", "objection": "Data centres are old news, and space ones are science fiction.", "answer": "Ground data centres are old news. The new question is whether some of that load leaves the ground in the 2030s. The session decides whether that's worth one line in a forecast.", "gap": "Chips overheat and must power down every 15–20 minutes on Google's prototype; radiation causes silent errors. Nobody has run a useful workload at scale.", "gb": "No GB network work found.", "abroad": "US: Starcloud and Google prototypes in orbit.", "matters": ["Long-term demand forecasters", "Connections strategy", "Data-centre account leads"], "evidence": [{"date": "10 Dec 2025", "text": "Starcloud-1 trained a small AI model in orbit on an Nvidia chip.", "src": "CNBC", "url": "https://www.cnbc.com/2025/12/10/nvidia-backed-starcloud-trains-first-ai-model-in-space-orbital-data-centers.html"}, {"date": "21 Aug 2026", "text": "Starcloud raised $250m. Next two satellites (8 kW each) fly in 2027; bigger ones depend on SpaceX's Starship.", "src": "TechCrunch", "url": "https://techcrunch.com/2026/08/21/starcloud-raises-200-million-for-orbital-data-centers-as-launch-options-dry-up/"}, {"date": "1 Oct 2026", "text": "Google's Project Suncatcher prototype, built with Planet, is in orbit and “operating as expected”.", "src": "Google", "url": "https://blog.google/innovation-and-ai/models-and-research/google-research/project-suncatcher-prototype/"}, {"date": "1 Oct 2026", "text": "Prototype runs 4 AI chips on about 1 kW. Chips power down every 15–20 minutes due to heat. Cost parity needs about $200 per kg launch, perhaps by the mid-2030s.", "src": "Payload", "url": "https://payloadspace.com/transporter-18-tests-the-building-blocks-of-orbital-data-centers/"}], "signposts": ["Starship flying often and reused", "Launch price per kg falling towards $200", "Google's two-satellite test in 2027", "A cloud firm moving a paying workload to orbit", "GB data-centre connection queue changes"], "ws": {"fmt": "ahead", "who": ["Long-term demand forecaster", "Connections strategy lead", "Data-centre account lead", "Innovation lead"], "preread": ["This card", "Google Suncatcher prototype post", "Payload report on Transporter-18"], "key_q": "Should our long-term demand forecasts carry an 'orbital compute' scenario, and what would make us act on it?", "scenario": "It is 2038. Launch costs have fallen. Some AI training runs in orbit; inference stays near users on the ground.", "signposts": ["Launch price per kg", "Starship flight rate", "Orbital compute contracts signed by cloud firms", "Data-centre withdrawals from GB queues"], "noregret": ["Add a low-probability orbital-compute line to long-term scenarios", "Ask data-centre customers how they see it", "Prefer flexible, profiled connections that cope with demand moving"], "partners": ["Data-centre customers and their trade body", "Space-sector analysts", "Other networks' forecasting teams"], "triggers": ["A cloud firm commits a large workload to orbit → re-run long-term data-centre scenarios", "Launch under $500 per kg → revisit"], "owner": "Long-term forecasting lead", "funding": "Watch only; no project spend.", "missing": ["Any independent cost study of orbital compute"], "path": ["Explore session: agree scenario and signposts", "Watch: twice-yearly check", "Revisit forecasts if a trigger fires"], "experiment": "Add a low-probability orbital-compute line to long-term scenarios", "measure": "Signposts agreed, with a named watcher and a trigger date", "measure_src": "efi"}, "abroad_list": [{"flag": "🇺🇸", "country": "US", "what": "Starcloud-1 trained a small AI model in orbit; Google's prototype is operating.", "result": "Demo", "url": "https://blog.google/innovation-and-ai/models-and-research/google-research/project-suncatcher-prototype/"}], "history": [{"date": "2026-10-29T09:30", "type": "New card", "text": "Added to the new Horizon tier, with evidence graded and links checked.", "example": false}], "time": "10–15", "updated": "2026-10-29T09:30", "cost_lo": null, "cost_band": "none", "whynow_card": null, "ex": {"support": 15, "explore": 4, "up": 11, "down": 6, "status": "Backed"}, "ukl": {"line": "UK Power Networks was the first distribution network to partner with the Data Centre Alliance (Nov 2025). Orbital compute will not relieve London's data-centre demand this decade, but it is a long-range question for how much of that pipeline is permanent.", "src": "UK Power Networks press release, 12 Nov 2025", "url": "https://www.ukpowernetworks.co.uk/news/electricity-distributor-signs-up-to-data-centre-partnership-in-uk-first", "more": [], "new": false}, "fmt": "90 minutes, get-ahead format", "agenda": [["0:00", "15 min", "Scenario: It is 2038. Launch costs have fallen. Some AI training runs in orbit; inference stays near users on the ground."], ["0:15", "15 min", "Evidence check: what is announced, demonstrated, piloted or generally available, and what is hype"], ["0:30", "20 min", "Signposts: what would tell us this is arriving, and who watches each one"], ["0:50", "20 min", "No-regret moves: what is worth doing now whatever happens"], ["1:10", "10 min", "Partners: who to get involved with, and how"], ["1:20", "10 min", "Triggers: agree the event that moves this to a project, and a review date"]]}, {"id": "H3", "ref": "Horizon research 29 Oct 2026", "event": false, "cats": ["flex"], "tier": "Horizon", "bridge": "B2", "grade": "demo", "hz": "10–15", "title": "Solar power collected in space and beamed to the ground", "short": "Space-based solar power", "position": "Horizon. Only tiny amounts of power have reached the ground. A first laser test from orbit is due.", "why": "Satellites that collect sunlight and beam it down could one day give round-the-clock power to a receiving site. So far only a trace has reached the ground. A first test aiming for tens of watts is under way.", "whynow": "Cowboy Space's Reason-1 launched 1 Oct 2026; beaming attempt due", "whynow_short": "Oct 2026", "cost": null, "comps": "No GB network spend. The UK government has funded space solar studies.", "breakthrough": "In 2023 Caltech's MAPLE beamed power wirelessly in space and sent a detectable signal to Earth.", "bridge_txt": "Cowboy Space (formerly Aetherflux) launched Reason-1 on 1 Oct 2026, aiming to send 30–100 W by laser to a ground spot 10–20 m wide. No result reported by 29 Oct 2026.", "innovation": "Get ahead: understand what a receiving site would need from a network (connection size, land, safety), before anyone asks.", "objection": "A hundred watts is a light bulb. This is decades away.", "answer": "Yes. The session is about signposts and what a receiver connection would look like, not about buying power.", "gap": "No orbit-to-ground power result yet. Costs and safety at grid scale are unknown.", "gb": "No GB network work found. A UK company, Space Solar, has a letter of intent (not a contract) with an Icelandic utility for 30 MW by 2030.", "abroad": "US: Caltech demo (2023), Cowboy Space test (2026). Iceland: letter of intent.", "matters": ["Long-term planning", "Innovation leads", "Connections strategy"], "evidence": [{"date": "1 Jun 2023", "text": "Caltech's MAPLE transmitted power wirelessly in space and beamed detectable power to Earth.", "src": "Caltech", "url": "https://www.caltech.edu/about/news/in-a-first-caltechs-space-solar-power-demonstrator-wirelessly-transmits-power-in-space"}, {"date": "1 Oct 2026", "text": "Reason-1 launched; it aims to beam 30–100 W to a ground spot. No result reported yet.", "src": "Payload", "url": "https://payloadspace.com/transporter-18-tests-the-building-blocks-of-orbital-data-centers/"}, {"date": "1 Oct 2026", "text": "Cowboy Space's own launch note.", "src": "Cowboy Space", "url": "https://www.cowboyspace.com/news/reason-1-takes-flight"}, {"date": "29 Oct 2024", "text": "Space Solar signed a letter of intent with Reykjavik Energy for 30 MW by 2030. A letter of intent is not a contract.", "src": "pv magazine", "url": "https://www.pv-magazine.com/2024/10/29/space-solar-secures-letter-of-intent-from-reykjavik-energy/"}, {"date": "2026", "text": "UK government-commissioned report on space solar pathways to net zero.", "src": "GOV.UK", "url": "https://assets.publishing.service.gov.uk/media/698f167c7da91680ad7f43ad/SBSP-enabled-pathways-to-net-zero-final-report-raf036-2425.pdf"}], "signposts": ["Reason-1 reports watts delivered on the ground", "UK government funding for a demonstrator", "A firm power-purchase contract, not a letter of intent", "Spectrum and safety rules for power beaming"], "ws": {"fmt": "ahead", "who": ["Long-term planning lead", "Innovation lead", "Connections strategy lead"], "preread": ["This card", "Caltech MAPLE news", "UK space solar report summary"], "key_q": "If a space-solar receiver asked to connect in the late 2030s, what would we need to know?", "scenario": "It is 2040. A demonstration receiver in the UK takes a few megawatts from orbit at set times of day.", "signposts": ["Watts, then kilowatts, delivered to the ground", "Government funding decisions", "Firm contracts signed"], "noregret": ["Track the Reason-1 result", "Note what a receiver connection would need (size, land, safety zone)"], "partners": ["UK space solar companies", "Government space and energy teams", "Universities working on beaming"], "triggers": ["A kilowatt-scale ground result → hold a scoping session", "A UK demonstrator funded → engage early on connection"], "owner": "Innovation lead", "funding": "Watch only.", "missing": ["Any orbit-to-ground result above a few watts"], "path": ["Explore session: signposts", "Watch: check after the Reason-1 attempt", "Revisit if a trigger fires"], "experiment": "Track the Reason-1 result", "measure": "Signposts agreed, with a named watcher and a trigger date", "measure_src": "efi"}, "abroad_list": [{"flag": "🇺🇸", "country": "US", "what": "Caltech beamed detectable power to Earth (2023); Cowboy Space's laser test awaits a result.", "result": "Demo", "url": "https://www.caltech.edu/about/news/in-a-first-caltechs-space-solar-power-demonstrator-wirelessly-transmits-power-in-space"}, {"flag": "🇮🇸", "country": "Iceland", "what": "Reykjavik Energy signed a letter of intent with Space Solar for 30 MW by 2030.", "result": "Letter of intent", "url": "https://www.pv-magazine.com/2024/10/29/space-solar-secures-letter-of-intent-from-reykjavik-energy/"}], "history": [{"date": "2026-10-29T09:30", "type": "New card", "text": "Added to the new Horizon tier, with evidence graded and links checked.", "example": false}], "time": "10–15", "updated": "2026-10-29T09:30", "cost_lo": null, "cost_band": "none", "whynow_card": null, "ex": {"support": 7, "explore": 1, "up": 5, "down": 6, "status": "Backed"}, "ukl": null, "fmt": "90 minutes, get-ahead format", "agenda": [["0:00", "15 min", "Scenario: It is 2040. A demonstration receiver in the UK takes a few megawatts from orbit at set times of day."], ["0:15", "15 min", "Evidence check: what is announced, demonstrated, piloted or generally available, and what is hype"], ["0:30", "20 min", "Signposts: what would tell us this is arriving, and who watches each one"], ["0:50", "20 min", "No-regret moves: what is worth doing now whatever happens"], ["1:10", "10 min", "Partners: who to get involved with, and how"], ["1:20", "10 min", "Triggers: agree the event that moves this to a project, and a review date"]]}, {"id": "H4", "ref": "Horizon research 29 Oct 2026; catalogue FR-ST-001", "event": false, "cats": ["connect", "assets"], "tier": "Horizon", "bridge": "B2", "grade": "announcement", "hz": "10–15", "title": "Fusion's first grid connections, and the superconducting cable it brings", "short": "Fusion and superconducting tape", "position": "Horizon. A fusion plant has applied to connect in the US. The nearer spin-off is superconducting tape for city cables.", "why": "A US fusion firm has applied to connect a 400 MW plant for the early 2030s, and Britain's prototype plant is planned for 2040. Fusion connects at high voltage, so the nearer benefit for local networks is the superconducting tape it is buying at scale, which also makes compact city cables.", "whynow": "First fusion grid application (Apr 2026); record tape order (Sep 2026)", "whynow_short": "Sep 2026", "cost": null, "comps": "Nearest GB spend: SCADENT superconducting cable study (2022).", "breakthrough": "Commonwealth Fusion Systems ordered more than 10,000 km of superconducting tape from Fujikura (Sep 2026). The firm calls it the largest such order; that is its own claim.", "bridge_txt": "The same high-temperature superconducting tape is used in compact power cables, which GB networks studied in SCADENT (2022).", "innovation": "Get ahead: track tape price, and re-run the city-cable case when it falls, rather than waiting for fusion power itself.", "objection": "Fusion is always 30 years away.", "answer": "We aren't betting on fusion power. Fusion's tape orders may make superconducting cables cheaper sooner; that's the signpost to watch.", "gap": "Fusion has not yet produced net electricity. Tape price per metre after the big orders is not public.", "gb": "SCADENT (2022, led by National Grid with UK Power Networks and others) studied superconducting cables. STEP, the UK prototype fusion plant at West Burton, is planned to operate in 2040.", "abroad": "US: first fusion grid application (PJM). Japan: tape maker scaling.", "matters": ["Cable and asset strategy", "Long-term planning", "Transmission interface teams"], "evidence": [{"date": "28 Apr 2026", "text": "Commonwealth Fusion Systems applied to connect a 400 MW fusion plant in Virginia to the PJM grid; studies can take 4–6 years.", "src": "CFS", "url": "https://cfs.energy/news-and-media/commonwealth-fusion-systems-becomes-first-fusion-company-to-apply-to-pjm-interconnection-the-largest-u.s.-wholesale-electricity-market"}, {"date": "16 Mar 2026", "text": "UK's STEP fusion plant at West Burton appointed a £200m construction partner; operation planned for 2040.", "src": "GOV.UK", "url": "https://www.gov.uk/government/news/ilios-appointment-speeds-delivery-of-step-fusion-at-west-burton"}, {"date": "30 Sep 2026", "text": "Fujikura order from CFS for more than 10,000 km of superconducting tape (company says largest).", "src": "Fujikura", "url": "https://www.fujikura.co.jp/en/news/pressrelease/20260930cfsarc1km.html"}, {"date": "Mar–May 2022", "text": "SCADENT studied superconducting cables for dense networks; UK Power Networks was a funding partner.", "src": "ENA Innovation Portal", "url": "https://smarter.energynetworks.org/projects/10027601/"}], "signposts": ["A fusion device producing net energy", "Published tape price per metre falling", "A superconducting cable pilot in a European city", "UK fusion connection applications"], "ws": {"fmt": "ahead", "who": ["Cable and asset strategy lead", "Long-term planning lead", "Innovation lead"], "preread": ["This card", "SCADENT summary", "CFS grid application note"], "key_q": "At what tape price would a superconducting city cable beat a new conventional circuit for us?", "scenario": "It is 2035. Fusion firms buy tape at scale and the price has halved. A European city installs a superconducting cable to avoid digging a new tunnel.", "signposts": ["Tape price", "Fusion net-energy result", "City cable pilots abroad"], "noregret": ["Dust off the SCADENT findings and note the break-even price", "Flag sites where a compact cable would avoid major civil works"], "partners": ["Tape makers", "Universities that worked on SCADENT", "National Grid (led SCADENT)"], "triggers": ["Tape price falls by half → re-run the city-cable case", "Net energy shown → brief long-term planning"], "owner": "Asset strategy lead", "funding": "NIA or Strategic Innovation Fund if the cable case is reopened.", "missing": ["Current tape price per metre"], "path": ["Explore session: break-even price", "Watch: annual tape-price check", "Project: reopen the cable case if triggered"], "experiment": "Dust off the SCADENT findings and note the break-even price", "measure": "Signposts agreed, with a named watcher and a trigger date", "measure_src": "efi"}, "abroad_list": [{"flag": "🇺🇸", "country": "US", "what": "First fusion plant to apply to connect to the PJM grid (400 MW, early 2030s).", "result": "Applied", "url": "https://cfs.energy/news-and-media/commonwealth-fusion-systems-becomes-first-fusion-company-to-apply-to-pjm-interconnection-the-largest-u.s.-wholesale-electricity-market"}, {"flag": "🇯🇵", "country" ge_txt": "On a 417-node test network, quantum hints cut a classical solver's time from 1,415 seconds to 35 seconds, but quantum overhead dominated end-to-end time on small and medium networks.", "innovation": "Get ahead: keep a benchmark of our own hardest switching problems, so any future quantum claim can be tested on our data.", "objection": "Quantum is all hype.", "answer": "Partly. These are preprints, not peer-reviewed, and not faster overall. That's why the move is a benchmark, not a purchase.", "gap": "No end-to-end speed-up shown; results are preprints.", "gb": "No GB network quantum-optimisation project found. NESO is working on quantum-safe security, which is a different topic.", "abroad": "US: EPB and IonQ.", "matters": ["Network planning", "Control-room optimisation", "Data and AI leads"], "evidence": [{"date": "28 Oct 2026", "text": "EPB and IonQ published three preprints on network reconfiguration on IonQ Forte hardware.", "src": "Quantum Computing Report", "url": "https://quantumcomputingreport.com/epb-and-ionq-deploy-hybrid-trapped-ion-algorithms-on-forte-enterprise-to-optimize-power-grid-topology/"}, {"date": "Oct 2026", "text": "Preprint: quantum-guided solver on networks up to 417 nodes.", "src": "arXiv", "url": "https://arxiv.org/abs/2609.40264"}], "signposts": ["An end-to-end speed-up on a real network", "Independent replication", "Error-corrected quantum machines", "A European utility trial"], "ws": {"fmt": "ahead", "who": ["Network planning lead", "Data and AI lead", "Innovation lead"], "preread": ["This card", "Quantum Computing Report summary"], "key_q": "Which of our optimisation problems would we test a quantum claim on?", "scenario": "It is 2036. Error-corrected machines are available as a cloud service and beat classical solvers on some switching problems.", "signposts": ["End-to-end speed-ups", "Independent replications", "Error-corrected machines"], "noregret": ["Build a benchmark of our hardest switching problems", "Share it with universities"], "partners": ["Universities", "Quantum cloud providers", "EPB as a peer utility"], "triggers": ["Independent end-to-end speed-up → test on our benchmark"], "owner": "Data and AI lead", "funding": "Watch; university partnership for a benchmark.", "missing": ["Peer-reviewed results"], "path": ["Explore session: choose the benchmark", "Watch: yearly", "Test if triggered"], "experiment": "Build a benchmark of our hardest switching problems", "measure": "Signposts agreed, with a named watcher and a trigger date", "measure_src": "efi"}, "abroad_list": [{"flag": "🇺🇸", "country": "US", "what": "EPB and IonQ ran network-reconfiguration tests on an on-site quantum computer.", "result": "Demo", "url": "https://quantumcomputingreport.com/epb-and-ionq-deploy-hybrid-trapped-ion-algorithms-on-forte-enterprise-to-optimize-power-grid-topology/"}], "history": [{"date": "2026-10-29T09:30", "type": "New card", "text": "Added to the new Horizon tier, with evidence graded and links checked.", "example": false}], "time": "10–15", "updated": "2026-10-29T09:30", "cost_lo": null, "cost_band": "none", "whynow_card": null, "ex": {"support": 9, "explore": 2, "up": 6, "down": 4, "status": "Backed"}, "ukl": {"line": "UK Power Networks' Python Power project (NIA, 2025–26, £358,000) made its network models usable in open-source power-flow software, and the models are published in the public LTDS CIM format. A benchmark of hard switching problems could be built on models like these, so any future quantum claim is tested on real networks.", "src": "ENA Innovation Portal (Python Power)", "url": "https://smarter.energynetworks.org/projects/nia_ukpn0111/", "more": [], "new": true}, "fmt": "90 minutes, get-ahead format", "agenda": [["0:00", "15 min", "Scenario: It is 2036. Error-corrected machines are available as a cloud service and beat classical solvers on some switching problems."], ["0:15", "15 min", "Evidence check: what is announced, demonstrated, piloted or generally available, and wh ocal network companies can spend and must deliver from 2023 to 2028. Its full name is RIIO-ED2.", "kind": "acronym"}, "MSRA": {"exp": "Microsoft Research Asia", "plain": "Microsoft's research lab in China.", "kind": "acronym"}, "BFI": {"exp": "business-funded innovation", "plain": "Innovation a network pays for itself.", "kind": "acronym"}, "MPAN": {"exp": "meter point administration number", "plain": "The unique number for an electricity supply point.", "kind": "acronym"}, "SSES": {"exp": "Smart Secure Electricity Systems programme", "plain": "A UK government programme setting rules for home devices such as EV chargers, heat pumps and batteries that can be switched remotely, including licences for firms that control them.", "kind": "acronym"}, "TO": {"exp": "transmission owner", "plain": "A company that owns the high-voltage transmission network in its area (in Scotland, SP Energy Networks and SSEN Transmission).", "kind": "acronym"}, "SP Energy Networks": {"exp": "SP Energy Networks", "plain": "The network company for central and southern Scotland, Merseyside, Cheshire and North Wales.", "kind": "name"}, "Super DuPPR": {"exp": "Super DuPPR", "plain": "A 2025 UK Power Networks innovation study (Strategic Innovation Fund Discovery) on whether battery reserve power for critical sites such as telecoms, with BT as the base case, could also serve as local flexibility.", "kind": "name"}, "FKIE": {"exp": "Fraunhofer FKIE", "plain": "A German research institute (part of Fraunhofer) that works on cyber security and communications.", "kind": "name"}, "AIxCC": {"exp": "AI Cyber Challenge", "plain": "A US government (DARPA) competition, 2023–25, for AI systems that find and fix software flaws.", "kind": "name"}, "B2U": {"exp": "B2U Storage Solutions", "plain": "A US company that reuses old electric-vehicle batteries as grid storage.", "kind": "name"}, "CN122047017A": {"exp": "CN122047017A", "plain": "The number of a Chinese patent application.", "kind": "name"}, "HICS": {"exp": "HICS", "plain": "SPEN project on AI controllers with local fail-safe units (2018–22).", "kind": "name"}, "V-PROTECTS": {"exp": "V-PROTECTS", "plain": "SPEN cyber project: a virtual test range for control systems.", "kind": "name"}, "NIMBUS": {"exp": "NIMBUS", "plain": "GB network wildfire-risk modelling project.", "kind": "name"}, "FRAME": {"exp": "FRAME", "plain": "GB network wildfire-risk project (FRAME I).", "kind": "name"}, "GRIDLOCK": {"exp": "GRIDLOCK", "plain": "NGED innovation project used as a cost comparison.", "kind": "name"}, "POISE": {"exp": "POISE", "plain": "NGET AI project, used as a cost comparison.", "kind": "name"}, "TRACTOR": {"exp": "TRACTOR", "plain": "DARPA programme translating old C code into the safer Rust language.", "kind": "name"}, "NEPATEC": {"exp": "NEPATEC", "plain": "PNNL dataset of US environmental review documents.", "kind": "name"}, "RAMS360": {"exp": "RAMS360", "plain": "GB innovation project used as a cost comparison.", "kind": "name"}, "ASA2": {"exp": "ASA2", "plain": "NESO Volta project using a genetic algorithm on schedules.", "kind": "name"}, "NSiaQF": {"exp": "NSiaQF", "plain": "NESO project: Network Security in a Quantum Future.", "kind": "name"}, "RAPID": {"exp": "RAPID", "plain": "SSEN Transmission consenting project.", "kind": "name"}, "WARN": {"exp": "WARN", "plain": "UK Power Networks weather-alert project (2023).", "kind": "name"}, "CREDO": {"exp": "CREDO", "plain": "GB weather-resilience project (CREDO+).", "kind": "name"}, "TEMPER": {"exp": "TEMPER", "plain": "SSEN weather and fault-risk project.", "kind": "name"}, "TWIN-SPIDER": {"exp": "TWIN-SPIDER", "plain": "NGET robotics project.", "kind": "name"}, "AEROINS": {"exp": "AEROINS", "plain": "NGET aerial inspection project.", "kind": "name"}, "ODIN": {"exp": "ODIN", "plain": "SSEN Transmission robotics project.", "kind": "name"}, "RISE": {"exp": "RISE", "plain": "SSEN robotics project.", "kind": "name"}, "SCADENT": {"exp": "SCADENT", "plain": "Superconducting cable study (2022), led by National Grid with UK Power Networks and others.", "kind": "name"}, "DESS": {"exp": "DESS", "plain": "Vodafone's distributed energy storage system for masts.", "kind": "name"}, "MAPLE": {"exp": "MAPLE", "plain": "Caltech's space power-beaming experiment.", "kind": "name"}, "ARC": {"exp": "ARC", "plain": "CFS's planned 400 MW fusion power plant.", "kind": "name"}, "SPARC": {"exp": "SPARC", "plain": "CFS's fusion test machine.", "kind": "name"}, "LK-99": {"exp": "LK-99", "plain": "A material claimed as a room-temperature superconductor in 2023; shown not to be one.", "kind": "name"}, "NESO087": {"exp": "NESO087", "plain": "NESO innovation project used as a cost comparison.", "kind": "name"}, "NGTO020": {"exp": "NGTO020", "plain": "NGET project reference.", "kind": "name"}, "ICSA-26-204-06": {"exp": "ICSA-26-204-06", "plain": "A CISA advisory number for a software flaw.", "kind": "name"}, "3DAR": {"exp": "3DAR", "plain": "GB weather-resilience project.", "kind": "name"}, "F1": {"exp": "F1", "plain": "Formula 1 motor racing.", "kind": "name"}, "CC": {"exp": "CC", "plain": "Part of the product name SpacerClear-CC (NGET).", "kind": "name"}, "BB": {"exp": "BB", "plain": "Part of the name Neural BB, a NESO project.", "kind": "name"}, "LBI": {"exp": "LBI", "plain": "SPEN link-box monitoring project (LBI IoT).", "kind": "name"}, "NB": {"exp": "NB", "plain": "Part of NB-IoT, see that entry.", "kind": "name"}, "ON": {"exp": "ON", "plain": "Part of the company name E.ON.", "kind": "name"}, "FDA": {"exp": "FDA", "plain": "US Food and Drug Administration, which approves medicines and medical devices.", "kind": "name"}}, "grades": {"announcement": "Announcement: a plan or order, nothing running yet", "demo": "Demo: shown working once or in trials, no results at scale", "pilot": "Pilot: running with real users, under supervision", "commercial": "Commercial: generally available and in routine use"}, "ins": {"users": 65, "active": 41, "visits": 212, "comments": 37, "avg_useful": 3.9, "survey": 28, "roles": [["Leadership", 6, 5], ["Innovation", 14, 12], ["Planning", 9, 6], ["Field engineering", 11, 6], ["Control", 7, 4], ["Asset management", 8, 5], ["Customer", 5, 2], ["Other", 5, 1]], "themes": [["Wants cost and funding detail earlier", 11, "I'd back it if I could see the funding route on the card."], ["Asks for more GB evidence", 9, "Has any other network tried this here?"], ["Likes the plain-English cards", 8, "First time I've understood post-quantum in two lines."], ["Horizon cards feel far off", 5, "Interesting, but what do I do with it this year?"], ["Asks for fewer emails", 4, "Monthly is plenty."]], "interests": [["Stay up in storms and fire", 29], ["Connect customers faster", 26], ["Find faults before customers do", 22], ["Balance a flexible system", 21], ["Keep control safe and secure", 18], ["Win consent, gain nature", 9], ["Horizon (5–15 years)", 15]], "freq": [["Monthly edition", 34], ["Only when ideas I follow change", 17], ["Both", 9], ["No updates", 5]], "pipeline": [["Backed by 10+ people", 19], ["“Explore this idea” session requested", 4], ["Exploring", 2], ["Experiment agreed", 1]]}, "xp": {"E1": {"today": "Automatic restoration switches the network after faults using fixed rules. Protection (devices that trip faulty kit) acts on single items, but nothing checks a multi-step AI switching plan.", "payoff": "Engineers could check AI switching plans against written safety rules, while the tool only gives advice.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Fixed rules", "s": "restoration scheme"}, {"t": "Switches", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "AI tool", "s": "suggests a plan"}, {"t": "Provable checker", "s": "approves or blocks", "hl": 1}, {"t": "Switches", "s": "advice only at first"}]}], "note": "Today's fixed rules stay as back-up."}, "with": "A checker with mathematically provable logic would sit between AI tools and switches. It would approve or block plans, advice-only at first, with today's fixed rules as back-up."}, "E2": {"today": "Many network rules are hand-written, such as the switching steps that restore supply after a fault. They are hard to improve by hand, so better versions may exist.", "payoff": "Better rules could mean shorter power cuts or more room on the existing network, without new building.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Pick one rule", "s": "e.g. restoration steps"}, {"t": "AI writes versions", "s": "readable code", "hl": 1}, {"t": "Score each one", "s": "network model, to be agreed"}, {"t": "Engineer signs off", "s": "after a safety check"}], "loop": [2, 1, "repeat thousands of times"]}], "note": null}, "with": "An AI tool, generally available since July 2026, could write thousands of readable versions of a rule. A network model would score each. Engineers would sign off the best."}, "E3": {"today": "Grid control software is tested without AI, mostly one network at a time, so flaws can be missed. Four were disclosed in widely used substation software in July 2026.", "payoff": "Could find flaws before attackers do, at a cost shared across networks rather than paid by each.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Open-source grid code", "s": "first test target"}, {"t": "AI hunts flaws", "s": "in the shared test lab", "hl": 1}, {"t": "Engineers fix flaws", "s": "in memory-safe code"}, {"t": "Share across networks", "s": "one lab, shared cost"}]}], "note": null}, "with": "AI bug-hunters would join GB's existing lab test setup, starting with open-source code. Networks would share it and fix flaws in memory-safe code, which rules out a common bug type."}, "E4": {"today": "Mobile masts keep backup batteries for power cuts, used only when the power fails. GB's 2025 study looked at local flexibility only.", "payoff": "Could add flexible capacity from batteries that already exist, while aiming to keep masts powered in storms.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Mast battery", "s": "backup only"}, {"t": "Mast powered in cuts", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "Mast battery"}, {"t": "Trades flexibility", "s": "minimum charge always kept", "hl": 1}, {"t": "Mast powered in cuts"}]}], "note": "Trading would pause on storm warnings."}, "with": "Batteries would also earn from grid balancing (matching supply and demand), as in Estonia since May 2026. A minimum charge would be kept, and trading paused on storm warnings."}, "E5": {"today": "Wildfires near upland lines are usually reported by people calling 999. Remote fires, like 2025's largest at Dava, have few people nearby.", "payoff": "Could give fire crews an earlier alert than the first 999 call, protecting lines nearby.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Fire starts"}, {"t": "Someone calls 999"}, {"t": "Fire service"}]}, {"label": "With this idea", "nodes": [{"t": "Fire starts"}, {"t": "Camera spots smoke", "s": "a person checks each alert", "hl": 1}, {"t": "Fire service"}]}], "note": "A GB pilot would measure the minutes gained."}, "with": "AI smoke cameras, as used by 15 US utilities, would sit on structures networks already own. A person would check every alert before sharing it with fire services."}, "E6": {"today": "As rooftop solar grows, very low summer demand can threaten the system. GB has no tested last-resort way to switch off rooftop solar.", "payoff": "Could give GB tested insurance against a rare emergency, if home solar inverters can be switched off remotely.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Very low demand"}, {"t": "Flexible tools only"}, {"t": "Rooftop solar", "s": "no tested switch-off"}]}, {"label": "With this idea", "nodes": [{"t": "Very low demand"}, {"t": "Flexible tools first"}, {"t": "Last-resort switch-off", "s": "tested yearly, notice agreed", "hl": 1}, {"t": "Rooftop solar", "s": "off only as last resort"}]}], "note": "A design study, not a deployment."}, "with": "A design study would set out who sends a switch-off, by what route, and yearly tests. Customer notice and compensation would be agreed first, and flexible tools used before it."}, "N1": {"today": "Some widely used grid protocol code is written in C, which is prone to memory bugs. The four flaws disclosed in July 2026 were this kind.", "payoff": "Could remove a whole class of security flaw from one library, instead of patching bugs one by one.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Control room"}, {"t": "C protocol library", "s": "prone to memory bugs"}, {"t": "Field device"}]}, {"label": "With this idea", "nodes": [{"t": "Control room"}, {"t": "Memory-safe library", "s": "bought or translated", "hl": 1}, {"t": "Field device"}]}], "note": null}, "with": "A pilot would swap one open-source library for a memory-safe version, ruling out that bug type. Where none exists, software would translate it, which is untested on grid code."}, "N3x": {"today": "Biodiversity net gain rules require evidence that projects leave nature better off. Network sites have power and data links, but no GB network was found using them to log wildlife.", "payoff": "Could give cheaper, continuous evidence for net-gain sites, if regulators accept sensor data.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Site sensors", "s": "sound and water samples"}, {"t": "AI names species", "hl": 1}, {"t": "Nature ledger", "s": "a continuous record"}, {"t": "Regulator review", "s": "acceptance untested"}]}], "note": null}, "with": "Sensors at network sites would record wildlife sounds and water DNA, with AI naming species. The data would sit in an existing nature programme."}, "N6": {"today": "Larger network schemes need environmental and net-gain statements. Specialists write and rework them by hand.", "payoff": "Could cut consultant hours and rework on larger schemes, if accountability rules are settled.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Past statements library", "s": "GB network examples"}, {"t": "AI first draft", "s": "plus a gap check", "hl": 1}, {"t": "Specialist edits"}, {"t": "Person signs off", "s": "accountable for the document"}]}], "note": null}, "with": "AI, using a library of past GB statements, would write first drafts and flag gaps. People would edit and sign every document."}, "N5x": {"today": "Connection applications are filled in by people or their consultants. Payment networks are now building ways for AI agents to act for people.", "payoff": "Could leave networks ready if agents arrive, for the effort of one discussion rather than a project.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Customer"}, {"t": "Fills in application"}, {"t": "Network checks"}]}, {"label": "With this idea", "nodes": [{"t": "Customer's AI agent", "s": "what if?", "hl": 1}, {"t": "Files application"}, {"t": "Network checks"}]}], "note": "No evidence of this happening yet."}, "with": "As a thought experiment, a customer's AI agent might file a connection application. Networks would ask what checks and rules that would need."}, "R8": {"today": "Link boxes (underground cable junctions) get yearly inspections. Earlier sensor trials did not replace those visits.", "payoff": "Could make a sensor in every link box affordable, catching problems between yearly visits.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Yearly visit"}, {"t": "Link box checked", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "Battery-free tag", "s": "in every box", "hl": 1}, {"t": "Reader picks up signal", "s": "if radio gets out"}, {"t": "Link box checked", "s": "between visits too"}]}], "note": null}, "with": "Battery-free tags, cheap enough for Walmart to expect 90 million in use, would go in every box. First, a test would check radio can get out of the metal box."}, "R6": {"today": "Checking designs and AI-written rules against network codes is slow, manual work. NESO's 2025 proof of concept is waiting on resources for a next step.", "payoff": "Could speed up compliance checks and act as referee for AI-written rules, such as E2.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Pick clear clauses", "s": "a small, unambiguous set"}, {"t": "Turn into logic", "s": "precise machine rules"}, {"t": "Machine checks design", "hl": 1}, {"t": "Engineer reviews flags"}]}], "note": null}, "with": "Off-the-shelf tools would turn a small set of clear network-code clauses into precise rules a machine can check. Engineers would review anything flagged."}, "S_N2": {"today": "Grid control equipment arrives without a list of the software inside it. So when a flaw is found, networks can't easily tell which kit has it.", "payoff": "Could let networks see quickly which kit a newly disclosed flaw affects.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Tender", "col": 1}, {"t": "Kit in service", "s": "contents unknown", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "Tender asks for list", "s": "software parts list", "hl": 1}, {"t": "Shared store", "s": "checked for known flaws"}, {"t": "Kit in service", "s": "contents known"}]}], "note": null}, "with": "Tenders would ask for a software parts list with every piece of control kit. Lists would be shared through a network-neutral store and checked for known flaws."}, "S16": {"today": "Networks pay for all their own street-level monitoring. In the US, insurers pay for home sensors that spot electrical arcing, a fire risk.", "payoff": "Could add street-level fault warnings paid for by someone else, if the vendor's claim holds up.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Network's own monitors", "s": "network pays"}, {"t": "Fault warning", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "Home sensors", "s": "insurers pay", "hl": 1}, {"t": "Checked against own data"}, {"t": "Fault warning"}]}], "note": "Vendor claim, not yet independently verified."}, "with": "A trial would test whether those sensors also warn of network faults, as the vendor claims. Results would be checked against the network's own monitoring."}, "S_N7": {"today": "Connection applications are checked by hand, and several GB networks are now trying AI checks. Each project risks learning the same hard lessons alone.", "payoff": "Could spare networks from each repeating the slow integration work: at PJM it took 10 months.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Application arrives"}, {"t": "AI checks it", "s": "flags gaps and issues", "hl": 1}, {"t": "Engineer decides", "s": "every final decision"}, {"t": "Lessons shared", "s": "across GB networks"}]}], "note": null}, "with": "AI would check applications while engineers make every decision, as at PJM in the US. GB networks would share lessons, especially on fitting AI into existing systems."}, "S_N3": {"today": "Today's encryption may one day be broken by quantum computers. Field kit bought now may still be in service then. Each network starting alone would repeat work.", "payoff": "Could protect long-lived kit for less effort than each network starting again.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Buying specification", "s": "today's encryption", "col": 1}, {"t": "Field kit in service", "col": 2}]}, {"label": "With this idea", "nodes": [{"t": "NESO quantum project", "s": "threat tools, Beta 2026–28", "hl": 1}, {"t": "Buying specification", "s": "adds quantum-safe encryption"}, {"t": "Field kit in service"}]}], "note": null}, "with": "NESO's Beta project (2026–28) is building tools to map quantum threats to energy assets and rank fixes. Networks would reuse them, and write quantum-safe encryption into their buying specifications."}, "S11": {"today": "Data-centre flexibility projects in GB are all at national or transmission level. None of 242 innovation projects mentioning data centres is a local network flexibility project.", "payoff": "Could release local network capacity at busy times, if enough data centres connect locally.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Local data centre"}, {"t": "Fixed demand"}, {"t": "Local network"}]}, {"label": "With this idea", "nodes": [{"t": "Local data centre"}, {"t": "Flexes on request", "s": "cuts demand when asked", "hl": 1}, {"t": "Local network"}]}], "note": "Not yet checked: how many data centres connect locally."}, "with": "Data centres on local networks would adjust their demand when asked, as an AI cluster did in a UK demo."}, "S9": {"today": "Storms can knock out mobile coverage, so networks are building dedicated satellite call points for crews.", "payoff": "Could give crews a cheaper back-up channel in storms, alongside dedicated kit rather than replacing it.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Crew in storm"}, {"t": "Satellite call point", "s": "dedicated kit"}, {"t": "Control room"}]}, {"label": "With this idea", "nodes": [{"t": "Crew in storm"}, {"t": "Ordinary phone", "s": "texts via satellite", "hl": 1}, {"t": "Control room"}]}], "note": "A fallback, not a replacement."}, "with": "Since February 2026, ordinary phones in GB can text via satellite. Storm-comms projects would test this as a lower-cost fallback."}, "S12": {"today": "Several networks already link weather forecasts to fault risk. Newer AI weather models exist, but no published head-to-head comparison in these tools was found.", "payoff": "Could give earlier, sharper warnings of storm faults, so crews are in place sooner.", "dg": {"type": "flow", "title": "How it would work", "rows": [{"nodes": [{"t": "Newer AI forecast"}, {"t": "Existing fault-risk tool"}, {"t": "Compare head to head", "hl": 1}, {"t": "Keep if better"}]}], "note": null}, "with": "Networks would run newer AI forecasts, such as Google DeepMind's WeatherNext 3, through existing fault-risk tools. They would keep them only if they beat today's forecasts."}, "S13": {"today": "Stability studies use detailed physics simulations that are slow to run. That limits how many situations engineers can check.", "payoff": "Could let engineers check many more cases quickly, though full-GB performance is not yet shown.", "dg": {"type": "beforeafter", "title": "What changes", "rows": [{"label": "Today", "nodes": [{"t": "Stability study"}, {"t": "Slow physics simulation"}, {"t": "Answer"}]}, {"label": "With this idea", "nodes": [{"t": "Stability study"}, {"t": "AI stand-in", "s": "trained on simulation runs", "hl": 1}, {"t": "Answer"}]}], "note": null}, "with": "AI stand-ins, trained on many simulation runs, would give fast answers. Networks would reuse NESO's tests, with over 94% accuracy in a simulated 400 kV grid."}, "S14": {"today": "Several GB networks are starting robot projects for lines and substations. Each runs its own trials; EFI sees value in pooling what they learn.", "payoff": "Could help each network pick robots that work, faster and with fewer repeated trials.", "dg": {"type": "precedent", "title": "Where it's been tried", "rows": [{"nodes": [{"t": "GB · 2023", "s": "Robot dog inspects cable tunnels", "tag": "Trial"}, {"t": "GB · 2025–27", "s": "Remote tree-cutting prototype", "tag": "Prototype under way", "hl": 1}, {"t": "Abroad", "s": "Not re-checked in this research", "tag": "Gap", "dash": 1}]}], "note": null}, "with": "Networks would share lessons from // v8 explainer: plain three-line summary and one small diagram per card.
// Diagram is drawn at 1:1 scale to its container width (text never scales below 11px), redrawn on resize and when fonts load.
function xesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const XF='Inter,system-ui,-apple-system,"Segoe UI",sans-serif';
let _xc;function xmeasure(t,px,wt){_xc=_xc||document.createElement('canvas').getContext('2d');_xc.font=`${wt||400} ${px}px ${XF}`;return _xc.measureText(t).width}
function xwrap(t,px,wt,max){const w=String(t||'').split(/\s+/).filter(Boolean);const L=[];let c='';
 for(const x of w){const n=c?c+' '+x:x;if(c&&xmeasure(n,px,wt)>max){L.push(c);c=x}else c=n}if(c)L.push(c);return L}
function xaria(d){const nd=n=>n.t+(n.s?' ('+n.s+')':'')+(n.tag?' ['+n.tag+']':'');
 return d.title+'. '+d.rows.map(r=>(r.label?r.label+': ':'')+r.nodes.map(nd).join(', then ')+(r.loop?'. Loop: '+r.loop[2]:'')).join('. ')+(d.note?'. Note: '+d.note:'')}
function dgm(d,W,id){
 const compact=W<520,F=compact?12:12.5,f=11,lh=F+4,lh2=f+4,pad=9;
 const hasLab=d.rows.some(r=>r.label),isP=d.type==='precedent';
 const n=Math.max(...d.rows.map(r=>r.nodes.length));
 // Try side labels first, then labels above the rows, then a tighter gap; go vertical only if nodes would still be under 118px.
 const tries=[[hasLab&&W>=560?104:0,compact?16:22],[0,compact?16:22],[0,16]];
 let labW=0,g=16,nw=0;for(const[lw,gg]of tries){labW=lw;g=gg;nw=(W-lw-(n-1)*gg)/n;if(nw>=118)break}
 const vert=nw<118;
 const labH=hasLab&&(vert||!labW)?20:0;
 const mk=`ah-${id}`;
 const prepNode=(nd,w)=>{const inner=w-2*pad;const t=xwrap(nd.t,F,600,inner),s=nd.s?xwrap(nd.s,f,400,inner):[],tg=nd.tag?xwrap(nd.tag,f,600,inner-8):[];
  const h=pad+t.length*lh+(s.length?2+s.length*lh2:0)+(tg.length?8+tg.length*lh2+4:0)+pad-3;return{nd,t,s,tg,h}};
 let o='',y=2;
 const drawNode=(p,x,yy,w,h)=>{const nd=p.nd;const fill=nd.hl?'#e7f2f2':'#fff',st=nd.hl?'#14545b':'#cfcac1',sw=nd.hl?1.6:1;
  o+=`<rect x="${x+.5}" y="${yy+.5}" width="${w-1}" height="${h-1}" rx="9" fill="${fill}" stroke="${st}" stroke-width="${sw}"${nd.dash?' stroke-dasharray="4 3"':''}/>`;
  let ty=yy+pad+F-1;p.t.forEach(l=>{o+=`<text x="${x+pad}" y="${ty}" font-size="${F}" font-weight="600" fill="#1a1a1c">${xesc(l)}</text>`;ty+=lh});
  if(p.s.length){ty+=2-lh+lh2;p.s.forEach(l=>{o+=`<text x="${x+pad}" y="${ty}" font-size="${f}" fill="#5f5e5a">${xesc(l)}</text>`;ty+=lh2})}
  if(p.tg.length){const th=p.tg.length*lh2+4,tyy=yy+h-pad-th+3;o+=`<rect x="${x+pad}" y="${tyy}" width="${w-2*pad}" height="${th}" rx="5" fill="${nd.dash?'#f1efea':'#fdf1dc'}"/>`;
   p.tg.forEach((l,k)=>{o+=`<text x="${x+pad+4}" y="${tyy+f+1+k*lh2}" font-size="${f}" font-weight="600" fill="${nd.dash?'#5f5e5a':'#8a5a12'}">${xesc(l)}</text>`})}};
 const arrow=(x1,y1,x2,y2)=>{o+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6b6a66" stroke-width="1.4"${isP?' stroke-dasharray="3 3"':''} marker-end="url(#${mk})"/>`};
 const label=(r,yy,cy)=>{if(!r.label)return;o+=labH?`<text x="0" y="${yy+13}" font-size="11" font-weight="600" fill="#14545b" letter-spacing=".04em">${xesc(r.label.toUpperCase())}</text>`
   :xwrap(r.label.toUpperCase(),11,600,labW-10).map((l,k,a)=>`<text x="0" y="${cy+4+(k-(a.length-1)/2)*15}" font-size="11" font-weight="600" fill="#14545b" letter-spacing=".04em">${xesc(l)}</text>`).join('')};
 if(!vert){
  const prep=d.rows.map(r=>r.nodes.map(nd=>prepNode(nd,nw)));const mh=Math.max(...prep.flat().map(p=>p.h));
  const X=i=>labW+i*(nw+g);
  d.rows.forEach((r,ri)=>{const by=y+labH;label(r,y,by+mh/2);
   const cols=r.nodes.map((nd,i)=>nd.col!=null?nd.col:(r.nodes.length<n&&i===r.nodes.length-1?n-1:i));
   prep[ri].forEach((p,i)=>{drawNode(p,X(cols[i]),by,nw,mh);if(i<r.nodes.length-1)arrow(X(cols[i])+nw+2,by+mh/2,X(cols[i+1])-3,by+mh/2)});
   y=by+mh;
   if(r.loop){const[a,b,lab]=r.loop,ax=X(a)+nw/2,bx=X(b)+nw/2,yb=y+2,yl=yb+18;
    o+=`<path d="M${ax},${yb} C${ax},${yl} ${bx},${yl} ${bx},${yb+3}" fill="none" stroke="#14545b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#${mk})"/><text x="${(ax+bx)/2}" y="${yl+12}" text-anchor="middle" font-size="${f}" fill="#14545b" font-weight="600">${xesc(lab)}</text>`;y+=34}
   y+=14});
 } else {
  const gut=d.rows.some(r=>r.loop)?26:0,w=W-gut,ag=22;
  d.rows.forEach((r,ri)=>{label(r,y,0);y+=labH;const ps=r.nodes.map(nd=>prepNode(nd,w));const tops=[];
   ps.forEach((p,i)=>{tops.push(y);drawNode(p,0,y,w,p.h);y+=p.h;if(i<ps.length-1){arrow(w/2,y+2,w/2,y+ag-3);y+=ag}});
   if(r.loop){const[a,b,lab]=r.loop,ya=tops[a]+ps[a].h/2,yb=tops[b]+ps[b].h/2;
    o+=`<path d="M${w+1},${ya} C${W-2},${ya} ${W-2},${yb} ${w+4},${yb}" fill="none" stroke="#14545b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#${mk})"/>`;
    y+=6;xwrap('↺ '+lab,f,600,W).forEach(l=>{y+=lh2;o+=`<text x="0" y="${y-3}" font-size="${f}" fill="#14545b" font-weight="600">${xesc(l)}</text>`})}
   y+=ri<d.rows.length-1?18:4});
 }
 const H=Math.ceil(y);
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false" font-family='${XF}'><defs><marker id="${mk}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="#6b6a66"/></marker></defs>${o}</svg>`}
function drawDgs(){document.querySelectorAll('.dgw[data-dg]').forEach(el=>{const x=D.xp[el.dataset.dg];if(!x)return;
 const W=Math.floor(el.clientWidth);if(!W||+el.dataset.w===W)return;el.dataset.w=W;el.innerHTML=dgm(x.dg,W,el.dataset.dg);
 if(!el._ro&&window.ResizeObserver){el._ro=new ResizeObserver(()=>drawDgs());el._ro.observe(el)}})}
// Card links inside explainer sentences: show the linked title in quotes so it reads mid-sentence.
function XT(t){return T(t).replace(/(<a href="#\/i\/[^"]+">)([^<]+)(<\/a>)/g,'$1‘$2’$3')}
function explainer(i){const x=D.xp&&D.xp[i.id];if(!x)return '';const d=x.dg;
 return `<section class="xpl" aria-labelledby="xp-${i.id}"><h2 id="xp-${i.id}">In plain words</h2>
 <dl><dt>Today</dt><dd>${XT(x.today)}</dd><dt>With this idea</dt><dd>${XT(x.with)}</dd><dt class="pay">The payoff</dt><dd>${XT(x.payoff)}</dd></dl>
 ${x.ukl?`<div class="xukl"><span class="lb">Pilot draft · UK Power Networks example, public sources</span>${T(x.ukl)}</div>`:''}
 <figure class="dg"><figcaption class="cap">${esc(d.title)}</figcaption><div class="dgw" data-dg="${i.id}" role="img" aria-label="${xesc(xaria(d))}"></div>${d.note?`<p class="dgn">${esc(d.note)}</p>`:''}</figure></section>`}
(function(){const m=document.querySelector('main');if(window.MutationObserver&&m)new MutationObserver(()=>requestAnimationFrame(drawDgs)).observe(m,{childList:true});
