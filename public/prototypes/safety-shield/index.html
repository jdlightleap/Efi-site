<script>
/* Safety shield checker: illustrative only.
   A small, deterministic rule checker for switching plans on a made-up radial network.
   Pure functions, no DOM, so the same code runs in the browser and in node tests. */
(function (root) {
'use strict';

/* ---------- Illustrative network (not a real one) ---------- */
const NETWORK = {
  name: 'Illustrative 11 kV network (made up)',
  vBand: { min: 94, max: 106 },            // % of nominal; illustrative band
  sources: {
    TA: { name: 'Primary transformer A', node: 'BA', ratingMW: 8 },
    TB: { name: 'Primary transformer B', node: 'BB', ratingMW: 7 }
  },
  sections: {
    BA: { name: 'Busbar A', bus: true },
    BB: { name: 'Busbar B', bus: true },
    A1: { name: 'Section A1', customers: 900 },
    A2: { name: 'Section A2', customers: 750 },
    A3: { name: 'Section A3', customers: 620 },
    B1: { name: 'Section B1', customers: 800 },
    B2: { name: 'Section B2', customers: 700 },
    B3: { name: 'Section B3', customers: 560 }
  },
  loads: {
    normal: { A1: 2.0, A2: 1.8, A3: 1.5, B1: 1.6, B2: 1.4, B3: 1.2 },
    peak:   { A1: 2.4, A2: 2.2, A3: 1.9, B1: 2.0, B2: 1.7, B3: 1.5 }
  },
  // Switching devices. Each one sits on a cable with a thermal rating (MW)
  // and a voltage-drop factor (% of nominal per MW carried).
  devices: {
    CBA: { name: 'Circuit breaker A', kind: 'breaker', a: 'BA', b: 'A1', ratingMW: 9, dropPerMW: 0.20 },
    S1:  { name: 'Switch S1', kind: 'switch', a: 'A1', b: 'A2', ratingMW: 6, dropPerMW: 0.35 },
    S2:  { name: 'Switch S2', kind: 'switch', a: 'A2', b: 'A3', ratingMW: 5, dropPerMW: 0.40 },
    NOP: { name: 'Normally open point', kind: 'switch', a: 'A3', b: 'B3', ratingMW: 4, dropPerMW: 0.50 },
    S4:  { name: 'Switch S4', kind: 'switch', a: 'B3', b: 'B2', ratingMW: 5, dropPerMW: 0.40 },
    S5:  { name: 'Switch S5', kind: 'switch', a: 'B2', b: 'B1', ratingMW: 6, dropPerMW: 0.35 },
    CBB: { name: 'Circuit breaker B', kind: 'breaker', a: 'BB', b: 'B1', ratingMW: 9, dropPerMW: 0.20 }
  }
};

/* ---------- The rule book: written down, short, testable ---------- */
const RULES = {
  R1: { title: 'Thermal limits', text: 'No cable, switch or transformer may carry more than its rating.' },
  R2: { title: 'Voltage band', text: 'Every energised section must stay between 94% and 106% of nominal voltage.' },
  R3: { title: 'No backfeed onto a faulted or earthed section', text: 'A section with an unrepaired fault, or with earths applied for a repair crew, must never be energised from any direction.' },
  R4: { title: 'No paralleling of different sources', text: 'Each live section must be fed from exactly one source by exactly one path. Closing a loop or joining two primary transformers is not allowed in this rule set.' },
  R5: { title: 'Protection and earthing interlocks', text: 'A switch next to an earthed section is locked open. Earths may only go on a dead, isolated section. A circuit breaker cannot close onto a faulted section.' },
  R0: { title: 'Plan is well formed', text: 'Every step must name a real device and change its state.' }
};

const srcName = (l) => l.split('+').map((x) => NETWORK.sources[x].name).join(' and ');
const dn = (id) => { const d = NETWORK.devices[id]; return d.kind === 'switch' && id !== 'NOP' ? d.name : `${d.name} (${id})`; };
const round = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;
const clone = (o) => JSON.parse(JSON.stringify(o));

function makeState(opts = {}) {
  const closed = {};
  for (const id of Object.keys(NETWORK.devices)) closed[id] = id !== 'NOP';
  Object.assign(closed, opts.closed || {});
  const level = opts.level || 'normal';
  const base = NETWORK.loads[level] || NETWORK.loads.normal;
  const scale = opts.scale == null ? 1 : opts.scale;
  const loads = {};
  for (const [k, v] of Object.entries(base)) loads[k] = round(v * scale, 3);
  Object.assign(loads, opts.loads || {});
  return { closed, loads, faulted: [...(opts.faulted || [])], earthed: [...(opts.earthed || [])] };
}

function adjacency(state) {
  const adj = {};
  for (const s of Object.keys(NETWORK.sections)) adj[s] = [];
  for (const [id, d] of Object.entries(NETWORK.devices)) {
    if (!state.closed[id]) continue;
    adj[d.a].push({ to: d.b, dev: id });
    adj[d.b].push({ to: d.a, dev: id });
  }
  return adj;
}

/* Evaluate one network state against R1 to R4 (R5 is about operations, see checkPlan).
   lastDevice (optional) names the device just operated, so a loop can be pinned on it. */
function evaluate(state, lastDevice) {
  const net = NETWORK, adj = adjacency(state);
  const violations = [];
  const srcAt = {};
  for (const [sid, src] of Object.entries(net.sources)) srcAt[src.node] = sid;
  // 1. Connected groups of sections through closed devices
  const comp = {}; const comps = [];
  for (const s of Object.keys(net.sections)) {
    if (comp[s] !== undefined) continue;
    const c = { nodes: [], devs: new Set(), sources: [] }; comps.push(c);
    const q = [s]; comp[s] = comps.length - 1;
    while (q.length) {
      const n = q.shift(); c.nodes.push(n); if (srcAt[n]) c.sources.push(srcAt[n]);
      for (const e of adj[n]) { c.devs.add(e.dev); if (comp[e.to] === undefined) { comp[e.to] = comps.length - 1; q.push(e.to); } }
    }
  }
  const fedBy = {};            // section -> source id, or 'TA+TB' when paralleled
  const radialComps = [];
  for (const c of comps) {
    if (!c.sources.length) continue;
    const label = c.sources.join('+');
    for (const n of c.nodes) fedBy[n] = label;
    const loop = c.devs.size >= c.nodes.length;   // a tree has nodes-1 edges
    const blame = lastDevice && c.devs.has(lastDevice) ? lastDevice : [...c.devs].filter((d) => d !== 'CBA' && d !== 'CBB').pop() || [...c.devs][0];
    if (c.sources.length > 1) {
      violations.push({ rule: 'R4', asset: blame, msg: `${dn(blame)} would join ${c.sources.map((x) => net.sources[x].name).join(' and ')} in parallel.` });
    } else if (loop) {
      violations.push({ rule: 'R4', asset: blame, msg: `${dn(blame)} would close a loop, so some sections would be fed by two paths.` });
    } else radialComps.push(c);
  }
  // 2. Radial load summation and voltage drop for each healthy radial group
  const flows = {}, tx = {}, volts = {};
  for (const c of radialComps) {
    const sid = c.sources[0], root0 = net.sources[sid].node;
    const parent = {}, order = [root0], seen = { [root0]: true };
    for (let i = 0; i < order.length; i++) for (const e of adj[order[i]]) if (!seen[e.to]) { seen[e.to] = true; parent[e.to] = { from: order[i], dev: e.dev }; order.push(e.to); }
    const sub = {};
    for (let i = order.length - 1; i >= 0; i--) {
      const n = order[i];
      sub[n] = (sub[n] || 0) + (state.loads[n] || 0);
      if (parent[n]) { flows[parent[n].dev] = round(sub[n], 3); sub[parent[n].from] = (sub[parent[n].from] || 0) + sub[n]; }
    }
    tx[sid] = round(sub[root0] || 0, 3);
    volts[root0] = 100;
    for (const n of order) if (parent[n]) volts[n] = round(volts[parent[n].from] - net.devices[parent[n].dev].dropPerMW * flows[parent[n].dev], 2);
  }
  const radial = violations.length === 0;
  // R3: faulted or earthed sections must be dead
  for (const s of state.faulted) if (fedBy[s] && !state.earthed.includes(s)) violations.push({ rule: 'R3', asset: s, msg: `${net.sections[s].name} has an unrepaired fault but would be energised from ${srcName(fedBy[s])}.` });
  for (const s of state.earthed) if (fedBy[s]) violations.push({ rule: 'R3', asset: s, msg: `${net.sections[s].name} has earths applied for a repair crew${state.faulted.includes(s) ? ' and an unrepaired fault' : ''} but would be energised from ${srcName(fedBy[s])}. This is the most dangerous kind of mistake.` });

    for (const sid of Object.keys(net.sources)) if (tx[sid] === undefined && !violations.some((x) => x.rule === 'R4')) tx[sid] = 0;
    for (const [sid, mw] of Object.entries(tx)) {
      const r = net.sources[sid].ratingMW;

      verdict = `<div class="vd ok" role="status"><div class="vh">✓ Approved by the checker</div><div class="vs">All ${Object.keys(S.RULES).length - 1} rules hold after every one of the ${r.trace.length} steps, not just at the end.</div>${kvHtml(end)}
      <div class="vs" style="margin-top:8px">Customers off: ${fmt(r.customersOffBefore)} before → ${fmt(r.customersOffAfter)} after.${r.peakCustomersOffDuring > r.customersOffBefore ? ` ${fmt(r.peakCustomersOffDuring)} customers see a short planned break part-way through.` : ''}${r.customersOffAfter ? ' The faulted section stays off until it is repaired.' : ''}</div>
      <div class="op"><div class="oh">Operator decision</div><p>${T('[[shadow mode]]: the checker only approves. A person still confirms, and in this demo nothing is sent anywhere.')}</p>
      ${U.confirmed ? `<div class="logd" role="status">${U.confirmed === 'yes' ? 'Logged as confirmed by the operator.' : 'Logged as rejected by the operator.'} Shadow mode: nothing was sent to any real network.</div>` : `<div class="row"><button type="button" class="btn pri" data-op="yes">Confirm plan</button><button type="button" class="btn" data-op="no">Reject</button></div>`}</div></div>`;
    } else {
      const t = r.trace[r.blockedAtStep - 1];
      verdict = `<div class="vd no" role="status"><div class="vh">✕ Blocked at step ${r.blockedAtStep}</div><div class="vs"><b>${esc(actText(t.action))}</b> breaks ${r.rulesBroken.length === 1 ? 'a rule' : r.rulesBroken.length + ' rules'}. The plan stops here and nothing is operated.</div>${reasonsHtml(r.reasons)}
      <div class="op"><div class="oh">Operator decision</div><p>A blocked plan never reaches the operator as an option. The planner has to come back with a different plan.</p>
      ${sc.plans[U.plan + 1] ? `<div class="row"><button type="button" class="btn pri" data-revise="1">Ask the AI to revise its plan</button></div>` : ''}</div></div>`;
    }
  }
  const hist = U.hist.map((h) => `<div class="hist"><b>${esc(h.label)}: blocked at step ${h.step}</b> (${h.rules.join(', ')}). ${esc(h.first)}</div>`).join('');
  return `<section class="scn" aria-labelledby="sct">
  <div class="ed">Scenario ${U.sc + 1} of ${S.SCENARIOS.length}</div><h2 id="sct">${esc(sc.title)}</h2><p class="story">${T(sc.story)}</p>
  <div class="lay"><figure class="dia"><div class="dcap"><span class="${would ? 'would' : ''}">${esc(cap)}</span><span>Illustrative network, not a real one</span></div>${svg(st, ev, hi)}${LEGEND}</figure>
  <div>${hist}<div class="plan"><div class="ph"><b>${esc(plan.label)}</b><span class="scr">Scripted to illustrate; a real version would use an AI planner</span></div><p class="why">${T(plan.why)}</p>
  <ol class="steps">${stepsHtml}</ol>
  ${r ? `<button type="button" class="start" data-view="0">Show the network before the plan</button>` : `<div class="row"><button type="button" class="btn pri" data-check="1">Run the checker</button></div>`}
  </div>${verdict}</div></div></section>`;
}

function sandboxState() {
  const sit = SB.sit;
  return S.makeState({ closed: SB.closed, scale: SB.scale, faulted: sit === 'none' ? [] : ['A2'], earthed: sit === 'earth' ? ['A2'] : [] });
}
function sandboxHtml() {
  const st = sandboxState(), live = S.checkState(st, SB.last && SB.last.target), ev = live.result;
  const reasons = [...SB.lastV, ...live.reasons.filter((x) => !SB.lastV.some((y) => y.rule === x.rule && y.asset === x.asset))];
  const ok = reasons.length === 0, hi = new Set(reasons.map((x) => x.asset));
  const sw = Object.keys(NET.devices).map((id) => `<button type="button" class="sw${hi.has(id) ? ' hi' : ''}" data-sw="${id}" aria-pressed="${st.closed[id]}"><span>${esc(devName(id))}</span><span class="s">${st.closed[id] ? 'CLOSED' : 'OPEN'}</span></button>`).join('');
  const sits = [['none', 'No fault'], ['fault', 'Fault on A2'], ['earth', 'Fault on A2, earths on']].map(([k, l]) => `<button type="button" data-sit="${k}" aria-pressed="${SB.sit === k}">${l}</button>`).join('');
  return `<section class="scn sbx" aria-labelledby="sbt"><div class="ed">Scenario 5 of 5 · Sandbox</div><h2 id="sbt">Try it yourself</h2>
  <p class="story">${T('Flip any switch, change the load or add a fault. The checker re-runs on every change. Nothing here is scripted: you are the planner.')}</p>
  <div class="lay"><figure class="dia"><div class="dcap"><span>Live state</span><span>Illustrative network, not a real one</span></div>${svg(st, ev, hi)}${LEGEND}</figure>
  <div><h3>Situation</h3><div class="seg">${sits}</div>
  <h3>Load</h3><div class="sl"><label for="ld" class="rt">Load vs normal</label><input id="ld" type="range" min="50" max="150" step="5" value="${Math.round(SB.scale * 100)}" aria-label="Load as a percentage of normal"><output for="ld">${Math.round(SB.scale * 100)}%</output></div>
  <h3>Switches</h3><div class="sws">${sw}</div>
  ${SB.last ? `<div class="last">Last action: ${esc(actText(SB.last))}</div>` : ''}
  <div class="vd ${ok ? 'ok' : 'no'}" role="status" aria-live="polite"><div class="vh">${ok ? '✓ Checker would approve' : '✕ Checker would block'}</div>
  <div class="vs">${ok ? 'Every rule holds for this network state.' : 'The checker would refuse a plan that leads here.'}</div>${ok ? kvHtml(ev) : reasonsHtml(reasons) + kvHtml(ev)}</div>
  <div class="row"><button type="button" class="btn" data-sbreset="1">Reset to normal running</button></div></div></div></section>`;
}

const RULES_HTML = () => `<ul class="rules">${['R1', 'R2', 'R3', 'R4', 'R5'].map((k) => `<li><span class="rid${SAFETY.has(k) ? ' saf' : ''}">${k}</span> <b>${esc(S.RULES[k].title)}</b><br>${esc(S.RULES[k].text)}</li>`).join('')}</ul>`;

function explainer() {
  return `<div class="exp">
  <div class="box"><h2>What this shows</h2><p>${T('An [[AI]] planner suggests how to switch the network, for example to restore customers after a fault. Before anything happens, a separate, much simpler checker tests every step of the plan against written rules. It approves or blocks, and says which rule and which piece of equipment. A person still confirms. The checker never trusts the AI; it only trusts the rules.')}</p></div>
  <div class="box"><h2>What "provable" means here</h2><p>${T('The rules are short and written down, and the checker is small enough to test completely. Because of that you can show, not just hope, that no plan from the AI can get past them, however clever or wrong the AI is. Here the rules are run against every one of 1,536 combinations of switch positions, faults and load levels. A real version would go further and use formal methods: mathematical proof that the checker code matches the rules.')}</p></div>
  <div class="box pr wide"><h2>Precedent</h2><ul>
   <li>${T('<b>State Grid, Changsha (China).</b> The "Guangming" system pairs a power-sector [[LLM]] with a physics model and a rule library. The AI proposes [[load transfer]]s, a dispatcher confirms, then the system carries them out. In use since the end of 2024: more than 2,900 transfers. Its checker is a physics model and rules, <b>not</b> a formal proof.').replace(/&lt;(\/?)b&gt;/g, '<$1b>')} <a class="src" href="https://www.cpem.org.cn/list2/117267.html" target="_blank" rel="noopener">Source: CPEM, 20 Mar 2026 ↗</a></li>
   <li>${T('[[PNNL]] designed a provable safety filter for grid-forming inverters (2020), shown in simulation only.')} <a class="src" href="https://www.pnnl.gov/publications/transient-safety-filter-design-grid-forming-inverters" target="_blank" rel="noopener">Source: PNNL ↗</a></li>
   <li>${T('Bb-Simplex, a safety layer for microgrids, was tested on an [[RTDS]] (IEEE Access, 2025). Aviation already has a standard for this pattern: [[ASTM]] F3269, "run-time assurance".')}</li>
   <li>${T('In Britain, the [[HICS]] project at [[SPEN]] (2018–22, £1.2m) proposed AI controllers with local fail-safe units, without formal verification or a working demonstrator. [[ARIA]] is spending £59m on AI that comes with mathematical safety guarantees.')}</li>
   <li>${T('UK Power Networks lists its Automated Power Restoration System among innovations now in everyday use. A provable checker would sit in front of exactly that kind of automatic switching, first in [[shadow mode]].')} <a class="src" href="https://smarter.energynetworks.org/media/13mb31kt/ukpn_nia-report-2026.pdf" target="_blank" rel="noopener">Source: NIA annual summary 2026 ↗</a></li>
  </ul></div>
  <div class="box nt"><h2>What this demo does NOT prove</h2><ul>
   <li>The network is made up: 6 sections, 2 transformers, made-up ratings and loads.</li>
   <li>The power flow is a rough approximation: loads simply add up along each feeder, and voltage drops by a fixed amount per ${T('[[MW]]')} carried. No reactive power, losses, generation, voltage rise or protection settings.</li>
   <li>The AI plans are scripted, not generated by a real AI.</li>
   <li>The tests here are exhaustive only for this tiny network. Nothing has been formally proven.</li>
   <li>Real switching rules are far richer than five rules. Writing them down is the hard part.</li>
  </ul></div>
  <div class="box"><h2>How a real experiment would start</h2><p>${T('[[shadow mode]] on historical events: replay one automatic restoration scheme’s past fault events through the checker, with no live control at all. Measure how often it would have vetoed an unsafe or unproven plan, and how often it would have blocked a plan that was in fact fine. Only then think about running it live alongside operators.')}</p>
  <h3>Cost (from research)</h3><p>${T('About £0.3–1.2m for a first experiment (EFI draft estimate). Comparable projects: AI Compass £329k, RAMS360 £550k, [[SPEN]] [[HICS]] £1.2m. Likely funding route: [[NIA]].')}</p></div>
  <div class="box wide"><h2>The rule book</h2><p>The checker uses only these five rules (plus a check that every step names a real device). Red rules are about safety; black rules are about limits.</p>${RULES_HTML()}</div>
  </div>`;
}
function glossary() {
  const keys = Object.keys(GLOSS).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  return `<div class="box" style="margin-top:10px" id="glossary"><h2>Glossary</h2><ul class="gl-l">${keys.map((k) => `<li id="g-${encodeURIComponent(k)}"><b>${esc(k)}</b>${GLOSS[k].exp !== k ? ` <span class="gx">${esc(GLOSS[k].exp)}</span>` : ''}<br>${esc(GLOSS[k].plain)}</li>`).join('')}</ul></div>`;
}

function render() {
  SCOPE = new Set();
  const tabs = [...S.SCENARIOS.map((s, i) => [i, s.tab]), [S.SCENARIOS.length, 'Try it yourself']];
  const intro = `<div class="ed">Prototype · Illustration</div><h1>Provable safety shield</h1>
  <p class="lede">${T('An [[AI]] proposes a switching plan. An independent checker tests it against simple, written rules and approves or blocks it, saying exactly why. In [[shadow mode]], nothing operates a real network and a person always confirms.')}</p>
  <div class="flags"><span class="flag ill">Illustrative network, not a real one</span><span class="flag sh">Shadow mode: operates nothing</span><span class="flag ne">Draft for review · Not endorsed by UK Power Networks</span></div>
  <div class="tabs" role="tablist" aria-label="Scenarios">${tabs.map(([i, l]) => `<button type="button" role="tab" class="tab${U.sc === i ? ' on' : ''}" aria-selected="${U.sc === i}" data-sc="${i}"><span class="n">${i + 1}</span>${esc(l)}</button>`).join('')}</div>`;
  const body = U.sc < S.SCENARIOS.length ? scenarioHtml() : sandboxHtml();
  $('#app').innerHTML = intro + body + explainer() + glossary() + `<p class="foot">Mockup for discussion. Draft for review. Not endorsed by UK Power Networks. Illustrative network and scripted AI plans; the checker logic is real and runs in your browser. No data leaves this page.</p>`;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('.term');
  if (t) { e.preventDefault(); e.stopPropagation(); if (popBtn === t) closePop(); else openPop(t); return; }
  if (e.target.closest('[data-pclose]')) { closePop(true); return; }
  if (e.target.closest('[data-gl]')) { closePop(); setTimeout(() => { const el = document.getElementById('g-' + encodeURIComponent(e.target.closest('[data-gl]').dataset.gl)); if (el) el.scrollIntoView({ block: 'center' }); }, 30); return; }
  if (!e.target.closest('#pop')) closePop();
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset; const sc = S.SCENARIOS[U.sc];
  if (d.sc != null) { resetScenario(+d.sc); render(); return; }
  if (d.check) { U.res = S.checkPlan(S.makeState(sc.initial), sc.plans[U.plan].steps); U.view = U.res.blockedAtStep || U.res.trace.length; render(); return; }
  if (d.view != null) { U.view = +d.view; render(); return; }
  if (d.op) { U.confirmed = d.op; render(); return; }
  if (d.revise) { const r = U.res; U.hist.push({ label: sc.plans[U.plan].label, step: r.blockedAtStep, rules: r.rulesBroken, first: r.reasons[0].msg }); U.plan++; U.res = null; U.view = null; U.confirmed = null; render(); return; }
  if (d.sw) { const prev = sandboxState(); const step = { op: prev.closed[d.sw] ? 'open' : 'close', target: d.sw };
    SB.lastV = S.operationViolations(prev, step).filter((x) => x.rule !== 'R0'); SB.last = step; SB.closed[d.sw] = !SB.closed[d.sw]; render(); focusSel(`[data-sw="${d.sw}"]`); return; }
  if (d.sit) { SB.sit = d.sit; SB.lastV = []; SB.last = null; render(); focusSel(`[data-sit="${d.sit}"]`); return; }
  if (d.sbreset) { SB.closed = S.makeState({}).closed; SB.scale = 1; SB.sit = 'none'; SB.last = null; SB.lastV = []; render(); return; }
});
document.addEventListener('input', (e) => { if (e.target.id === 'ld') { SB.scale = +e.target.value / 100; SB.lastV = []; render(); const el = $('#ld'); if (el) el.focus(); } });
function focusSel(q) { const el = $(q); if (el) el.focus({ preventScroll: true }); }

/* ---------- glossary popover ---------- */
let popBtn = null;
function openPop(b) {
  const k = b.dataset.term, g = GLOSS[k]; if (!g) return;
  if (popBtn) popBtn.setAttribute('aria-expanded', 'false');
  popBtn = b; b.setAttribute('aria-expanded', 'true');
  const p = $('#pop'); p.setAttribute('aria-label', k + ' meaning');
  p.innerHTML = `<button type="button" class="pc" data-pclose="1" aria-label="Close">✕</button><b>${esc(k)}</b>${g.exp !== k ? `<span class="px">${esc(g.exp)}</span>` : ''}<div>${esc(g.plain)}</div><a href="#glossary" data-gl="${esc(k)}">All terms in the glossary →</a>`;
  p.hidden = false; const r = b.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let x = r.left + window.scrollX + r.width / 2 - pw / 2; x = Math.max(window.scrollX + 14, Math.min(x, window.scrollX + document.documentElement.clientWidth - pw - 14));
  let y = r.bottom + window.scrollY + 8; if (r.bottom + ph + 16 > window.innerHeight && r.top > ph + 16) y = r.top + window.scrollY - ph - 8;
  p.style.left = x + 'px'; p.style.top = y + 'px';
}
function closePop(focusBack) { const p = $('#pop'); if (!p || p.hidden) return; p.hidden = true; if (popBtn) { popBtn.setAttribute('aria-expanded', 'false'); if (focusBack) popBtn.focus(); } popBtn = null; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(true); });

// deep links for screenshots/tests: #s=1..5
const m = location.hash.match(/s=(\d)/); if (m) resetScenario(Math.min(+m[1] - 1, S.SCENARIOS.length));
render();
window.__demo = { U, SB, render };
})();

</script>
</body>
</html>
